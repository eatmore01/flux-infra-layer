apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    installCRDs: true
    priorityClassName: "system-cluster-critical"
    resources:
      limits:
        cpu: 2000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
            - flux-admin
      networkPolicy:
        create: false
    logLevel: "info"
