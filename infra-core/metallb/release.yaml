apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  chart:
    spec:
      chart: metallb
      version: "0.15.3"
      sourceRef:
        kind: HelmRepository
        name: metallb
  interval: 1h
  values:
    controller:
      enabled: true
      resources:
        requests:
          cpu: "10m"
          memory: "128Mi"
        limits:
          cpu: "50m"
          memory: "245Mi"
    speaker:
      enabled: true
      resources:
        requests:
          cpu: "20m"
          memory: "64Mi"
        limits:
          cpu: "40m"
          memory: "128Mi"
