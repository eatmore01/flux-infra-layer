apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra-apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs: []
  resourcesTemplate: |
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: << inputs.namespace >>
      labels:
        kustomize.toolkit.fluxcd.io/prune: "disabled"
      annotations:
        fluxcd.controlplane.io/prune: disabled
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.component >>
      namespace: infra-apps
    spec:
      path: ./infra-apps/<< inputs.component >>
      prune: true
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      targetNamespace: << inputs.namespace >>
      interval: 12h
      retryInterval: 5m
      timeout: 5m
      wait: true
      <<- if hasKey inputs "dependsOn" >>
      dependsOn:
        <<- range $d := inputs.dependsOn >>
        - name: << $d.name >>
          namespace: << $d.namespace >>
        <<- end >>
      <<- end >>
