apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra-core
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
  - component: "metallb"
    namespace: "metallb-system"

  - component: "envoy-gateway"
    namespace: "gateway-system"

  - component: "cert-manager"
    namespace: "cert-manager"

  - component: "metrics-server"
    namespace: "metrics-server"
  resourcesTemplate: |
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: << inputs.namespace >>
      labels:
        kustomize.toolkit.fluxcd.io/prune: "disabled"
      annotations:
        fluxcd.controlplane.io/prune: disabled
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.component >>
      namespace: infra-core
    spec:
      path: ./infra-core/<< inputs.component >>
      prune: true
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      targetNamespace: << inputs.namespace >>
      interval: 2h
      retryInterval: 5m
      timeout: 5m
      wait: true
      <<- if hasKey inputs "dependsOn" >>
      dependsOn:
        <<- range $d := inputs.dependsOn >>
        - name: << $d.name >>
          namespace: << $d.namespace >>
        <<- end >>
      <<- end >>
