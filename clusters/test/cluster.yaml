apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cluster
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
  - component: "infra-core"
    namespace: "flux-system"

  - component: "infra-apps"
    namespace: "flux-system"
    dependsOn:
    - name: "infra-core"
      namespace: "flux-system"
  wait: true
  resourcesTemplate: |
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.component >>
      namespace: << inputs.namespace >>
    spec:
      interval: 1h
      path: ./cluster/test/<< inputs.component >>
      prune: true
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      targetNamespace: << inputs.namespace >>
      retryInterval: 5m
      wait: true
      timeout: 5m
      <<- if hasKey inputs "dependsOn" >>
      dependsOn:
        <<- range $d := inputs.dependsOn >>
        - name: << $d.name >>
          namespace: << $d.namespace >>
        <<- end >>
      <<- end >>

