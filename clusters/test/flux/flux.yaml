apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
  - component: "flux-operator"
    namespace: "flux-system"

  - component: "flux-instance"
    namespace: "flux-system"
    dependsOn:
    - name: "flux-operator"
      namespace: "flux-system"
  resourcesTemplate: |
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: << inputs.namespace >>
      labels:
        kustomize.toolkit.fluxcd.io/prune: "disabled"
      annotations:
        fluxcd.controlplane.io/prune: disabled
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.component >>
      namespace: << inputs.namespace >>
    spec:
      interval: 1h
      path: ./flux/<< inputs.component >>
      prune: true
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      targetNamespace: << inputs.namespace >>
      retryInterval: 5m
      wait: true
      timeout: 5m
      <<- if hasKey inputs "dependsOn" >>
      dependsOn:
        <<- range $d := inputs.dependsOn >>
        - name: << $d.name >>
          namespace: << $d.namespace >>
        <<- end >>
      <<- end >>
